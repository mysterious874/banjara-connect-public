<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#7A263A">
  <link rel="manifest" href="/manifest.webmanifest">
  <title>Install Banjara Connect</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100dvh;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#faf5ea;color:#241c1d;display:grid;place-items:center;padding:24px}
    .wrap{width:min(430px,100%);text-align:center}.logo{width:82px;height:82px;margin:0 auto 18px;border-radius:22px;display:grid;place-items:center;background:#7A263A;color:#fff;font-size:34px;font-weight:800;box-shadow:0 10px 28px #0002}
    h1{margin:0 0 8px;font-size:28px}.sub{margin:0 auto 24px;line-height:1.5;opacity:.75}
    .card{background:#fff;border-radius:22px;padding:22px;box-shadow:0 10px 35px #00000012;text-align:left}
    button{width:100%;border:0;border-radius:14px;padding:15px;background:#7A263A;color:#fff;font-size:16px;font-weight:700;cursor:pointer}
    .note{margin:16px 0 0;line-height:1.5;font-size:14px;opacity:.75;text-align:center}.back{display:block;margin-top:18px;text-align:center;color:#7A263A;text-decoration:none;font-weight:650}
  </style>
</head>
<body>
  <main class="wrap">
    <div class="logo">BC</div>
    <h1>Banjara Connect</h1>
    <p class="sub">Install the app for a faster, full-screen community experience.</p>
    <section class="card">
      <button id="install">Install Banjara Connect</button>
      <p id="note" class="note">If the install prompt does not appear, use your browser menu and choose “Install app” or “Add to Home screen”.</p>
    </section>
    <a class="back" href="/">Continue to Banjara Connect</a>
  </main>
<script>
let deferred;
const btn=document.getElementById('install'),note=document.getElementById('note');
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e;});
btn.addEventListener('click',async()=>{
  if(deferred){deferred.prompt();const c=await deferred.userChoice;if(c.outcome==='accepted')note.textContent='Banjara Connect is being installed.';deferred=null;}
  else note.textContent='Open the browser menu and choose “Install app” or “Add to Home screen”.';
});
window.addEventListener('appinstalled',()=>{btn.textContent='App installed';btn.disabled=true;});
</script>
</body>
</html>
