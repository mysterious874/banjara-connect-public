name: Banjara Connect - Auto Health & Safe Repair

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: banjara-connect-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-safe-repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        id: locked_install
        run: npm ci

      - name: Build
        id: build
        run: npm run build

      - name: Safe dependency recovery
        if: failure() && steps.locked_install.outcome == 'failure'
        run: |
          echo "npm ci failed; retrying with a clean dependency resolution."
          rm -rf node_modules
          npm install
          npm run build

      - name: Report
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "Banjara Connect health check passed."
          else
            echo "Banjara Connect still has a build failure."
            echo "No source code, database, auth, RLS, secrets, or production data was modified."
          fi
